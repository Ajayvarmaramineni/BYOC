[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byoc-storage"
version = "0.3.0"
description = "BYOC (Bring Your Own Cloud) — universal storage abstraction for storage your users already own"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ajay Ramineni" }]
keywords = ["byoc", "cloud-storage", "google-drive", "s3", "webdav", "storage-abstraction"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "cryptography>=42.0",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "wsgidav>=4.3",
  "cheroot>=10.0",
  "mypy>=1.9",
  "ruff>=0.4",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "types-defusedxml>=0.7",
]

[project.urls]
Homepage = "https://github.com/Ajayvarmaramineni/BYOC"
Repository = "https://github.com/Ajayvarmaramineni/BYOC"
Issues = "https://github.com/Ajayvarmaramineni/BYOC/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/byoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Import the package straight from the source tree rather than relying on an
# editable install. Editable-install .pth handling varies across Python
# versions, and the test run should not depend on it.
pythonpath = ["src", "tests"]
markers = [
  "integration: needs a live storage server (MinIO, Nextcloud); skipped when unreachable",
  "interop: runs both SDKs against the same server; needs node and a built TypeScript dist/",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
